name: Release

on:
  push:
    branches:
      - master

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - run: pnpm -F @apps/react exec playwright install --with-deps chromium

      - name: Typecheck and test
        run: pnpm turbo run typecheck test

  # Runs apart from `verify` so test and browser tooling cannot alter what ships.
  build:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
      version: ${{ steps.pack.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm turbo run build --filter=storybook-vrhythm

      - name: Pack
        id: pack
        working-directory: packages/storybook-vrhythm
        run: |
          TARBALL=$(npm pack --ignore-scripts --silent --pack-destination "$RUNNER_TEMP")
          SHA256=$(sha256sum "$RUNNER_TEMP/$TARBALL" | cut -d' ' -f1)
          VERSION=$(node -p "require('./package.json').version")
          {
            echo "tarball=$TARBALL"
            echo "sha256=$SHA256"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 1

  version:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      has-changesets: ${{ steps.changesets.outputs.has-changesets }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create release PR
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # Holds npm release authority, so it must run no repository or dependency code.
  # The `environment` name must match the npm trusted-publisher entry.
  publish:
    needs: [build, version]
    if: needs.version.outputs.has-changesets == 'false'
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      id-token: write
    outputs:
      published: ${{ steps.npm-publish.outputs.published }}

    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package

      - name: Verify package digest
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: echo "$SHA256  $TARBALL" | sha256sum --check --strict

      - name: Publish to npm
        id: npm-publish
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if npm view "storybook-vrhythm@${VERSION}" version 2>/dev/null; then
            echo "Version ${VERSION} already published, skipping"
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            # npm refuses to publish a prerelease version without an explicit tag
            case "$VERSION" in
              *-*) DIST_TAG=next ;;
              *) DIST_TAG=latest ;;
            esac
            npm publish "./$TARBALL" --access public --tag "$DIST_TAG" --ignore-scripts
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

  github-release:
    needs: [build, publish]
    if: needs.publish.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create git tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          TAG="storybook-vrhythm@${VERSION}"
          case "$VERSION" in
            *-*) PRERELEASE_FLAG=--prerelease ;;
            *) PRERELEASE_FLAG= ;;
          esac
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            $PRERELEASE_FLAG
