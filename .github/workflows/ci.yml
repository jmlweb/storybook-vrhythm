name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.22.2", "24"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ matrix.node-version }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ matrix.node-version }}-

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm -F @apps/react exec playwright install --with-deps chromium

      - run: pnpm turbo run typecheck test build --cache-dir=.turbo

      - name: Check the published package
        working-directory: packages/storybook-vrhythm
        run: |
          pnpm exec publint .
          pnpm exec attw --pack . --profile esm-only --exclude-entrypoints ./preset

      - run: pnpm turbo run build-storybook --cache-dir=.turbo
