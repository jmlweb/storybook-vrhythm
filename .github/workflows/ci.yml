name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.22.2", "24"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ matrix.node-version }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ matrix.node-version }}-

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm -F @apps/react exec playwright install --with-deps chromium

      - run: pnpm turbo run typecheck test build --cache-dir=.turbo

      - name: Check the published package
        working-directory: packages/storybook-vrhythm
        run: |
          pnpm exec publint .
          pnpm exec attw --pack . --profile esm-only --exclude-entrypoints ./preset

      - run: pnpm turbo run build-storybook --cache-dir=.turbo

  storybook-10:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm

      # The lockfile pins Storybook 11, so this job resolves its own dependencies.
      - name: Override Storybook with version 10
        run: |
          node --input-type=module -e "
            import { readFileSync, writeFileSync } from 'node:fs';
            const packages = ['storybook', '@storybook/react', '@storybook/react-vite', '@storybook/addon-vitest', '@storybook/vue3', '@storybook/vue3-vite', '@storybook/html', '@storybook/html-vite'];
            const entries = packages.map((name) => '  \"' + name + '\": ^10.0.0').join('\n');
            const file = 'pnpm-workspace.yaml';
            writeFileSync(file, readFileSync(file, 'utf8').replace('overrides:', 'overrides:\n' + entries));
          "
          pnpm install --no-frozen-lockfile

      - run: pnpm -F @apps/react exec playwright install --with-deps chromium

      - run: pnpm -F storybook-vrhythm build

      - run: pnpm -F storybook-vrhythm test

      - run: pnpm -F @apps/react test
